id: question-permissions-model
type: question
confidence: frontier
title: "Permissions model for agent invocation (Sidestep(api:*) etc.)"
content: |
  sidestep is intended for agent invocation. Claude Code can scope
  permissions like `Sidestep(api:listWorkflowRuns)` or `Sidestep(api:*)`
  if the operationId is the addressable unit.

  Status 2026-07-24 (finding-008): `docs/permissions.md` shipped —
  read-only primitive allowlist, `api` deliberately gated (prefix rules
  can't see HTTP methods), never-allowlist set (`api:*`, `auth login`),
  optional deny-list on `api post_*/put_*/delete_*` via the synthesized
  operationId convention. The recommended-patterns output exists; the
  granularity questions below remain open and should be revisited if
  v0.2 mutating verbs land.

  Open:
  - Is operationId the right granularity? Or should it be HTTP method
    (`Sidestep(api:get*)` for read-only)?
  - Should curated verbs (when they land — see
    question-curated-cli-verbs) use a separate axis like
    `Sidestep(detections:*)`, or fold under the api: scope?
  - How do we want permissions to interact with the audit trail's
    `auth_source` field — should a config-file-sourced token have
    different default scoping than env?

  UPDATE 2026-11-01 (harvest I-86, finding-sidestep-0a17-policy-store-egress-without-workflow-edit).
  The desk finding on Policy Store egress designs a workflow-scope policy
  verb (list, create, attach, with detach as its undo). It would be the
  first mutating verb in sidestep, and there is no write-guard yet, so
  the guard is part of building it: this question's granularity and
  scoping points become load-bearing at that moment. Today the same
  change is reachable as three `sidestep api` calls, which
  `docs/permissions.md` already gates as mutations.

  Output: `docs/permissions.md` recommending patterns for typical
  agent scopes (read-only triage, write-permitted suppression flows,
  org-admin operations).
