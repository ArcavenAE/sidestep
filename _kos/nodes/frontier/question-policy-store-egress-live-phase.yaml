id: question-policy-store-egress-live-phase
type: question
confidence: frontier
title: "Does a stored Policy Store policy change a blocked workflow's egress, on each runner type, without a workflow edit?"
content: |
  Opened 2026-11-01 (harvest I-86) from finding-sidestep-0a17 and its probe
  brief. The desk phase is complete: the vendored spec has four Policy Store
  operations, a workflow-scope policy overrides broader scopes, and a stored
  policy applies without a workflow change only where the runner fetches it.
  Nothing was run against a tenant.

  Open, and each is a case in the brief's live phase:
  - whether the API, unlike the UI, refuses a second attach (the 409 is in
    the spec and was not observed) rather than replacing the current one;
  - whether a partial update can remove an endpoint, or only add and replace;
  - on every runner type, whether inline `allowed-endpoints` and
    `use-policy-store: true` in one step combine, or one wins;
  - on an ARC runner whose job carries a Harden-Runner step with inline
    block settings, whether a store policy or the inline settings win.

  The live phase needs a test tenant with a throwaway repository and
  workflow, and an operator's go-ahead for writes there; production tenants
  stay read-only throughout. Until it runs, a verb that wraps the surface
  would promise more than the desk evidence supports.
