[licenses]
# Permissive-only by default. Copyleft (including weak/file-level MPL-2.0)
# requires an explicit per-crate exception below.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# Per-crate exceptions for non-permissive licenses. Each entry must
# document why this specific crate is accepted at this license.
[[licenses.exceptions]]
# progenitor's runtime client. Required for the spec-driven codegen
# pipeline (see charter B2). MPL-2.0 is file-level copyleft only;
# unmodified use as a dependency is unrestricted.
name = "progenitor-client"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
# progenitor codegen library — used at xtask time to regenerate
# sidestep-api from the OpenAPI spec. MPL-2.0 file-level copyleft.
name = "progenitor"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
# progenitor's implementation crate. Same provenance and posture.
name = "progenitor-impl"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
# progenitor's macro support. Same provenance and posture.
name = "progenitor-macro"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
# Transitive via the `dirs` crate (XDG path resolution). Mozilla-origin
# helper for Option<T> ergonomics. MPL-2.0 file-level copyleft, unmodified.
name = "option-ext"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# RUSTSEC-2024-0436 (paste, via cel-interpreter 0.10) was ignored here
# until the cel 0.13 upgrade dropped paste from the tree entirely.
ignore = [
    # zvariant, zbus_names and zvariant_derive are unmaintained per
    # RUSTSEC-2026-0370, 0371 and 0372, with no patched version. All three come
    # from zbus 5, which keyring pulls through secret-service and
    # zbus-secret-service-keyring-store (the Linux secret store). zbus 6 is the
    # migration. Re-check 2026-11-06.
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained, no patched version; via zbus 5 from keyring; zbus 6 is the migration; re-check 2026-11-06" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained, no patched version; via zbus 5 from keyring; zbus 6 is the migration; re-check 2026-11-06" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained, no patched version; via zbus 5 from keyring; zbus 6 is the migration; re-check 2026-11-06" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
