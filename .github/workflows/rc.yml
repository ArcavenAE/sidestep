# RC Release
# Triggers: push (merge) to main. Cuts an automatic v<version>-rc.N
# prerelease — N increments per merge for the Cargo.toml base version —
# and updates Formula/sidestep-rc.rb in the tap. The rc channel installs
# as `sidestep-rc` and coexists with sidestep-a (develop, alpha.yml) and
# stable sidestep (exact-semver v* tags, release.yml). Tags created here
# use GITHUB_TOKEN, which does not trigger release.yml (GitHub
# anti-recursion); release.yml additionally guards out prerelease tags.
# macOS arm64 only.
name: RC Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '_kos/**'
      - 'spec/**.sha256'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
      - 'Formula/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build (aarch64-apple-darwin)
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - uses: step-security/rust-cache@851174d9a2fdc03e0896e02844dcc61d81dd7851 # v2.9.1
        with:
          cache-on-failure: true

      - name: Compute next rc number
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          # Tags aren't fetched at depth 1 — ask the remote directly.
          LAST_N=$(git ls-remote --tags origin "refs/tags/v${BASE}-rc.*" \
            | sed -n "s|.*refs/tags/v${BASE}-rc\.\([0-9]*\)$|\1|p" \
            | sort -n | tail -1)
          N=$(( ${LAST_N:-0} + 1 ))
          VERSION="${BASE}-rc.${N}"
          TAG="v${VERSION}"
          echo "computed ${TAG} (base ${BASE}, previous rc: ${LAST_N:-none})"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build rc binary
        run: |
          cargo build --release --target aarch64-apple-darwin --bin sidestep
          cp target/aarch64-apple-darwin/release/sidestep sidestep-darwin-arm64

      - name: Verify binary
        run: ./sidestep-darwin-arm64 --version

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc-binaries-darwin-arm64
          path: sidestep-darwin-arm64

  sign-and-notarize:
    name: Sign & Notarize
    needs: build
    if: vars.SIGNING_ENABLED == 'true'
    permissions:
      contents: write
    environment: release
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Download rc binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rc-binaries-darwin-arm64

      - name: Import certificates
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain

          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm cert.p12

          curl -sfo /tmp/DeveloperIDG2CA.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security add-certificates -k build.keychain /tmp/DeveloperIDG2CA.cer
          rm /tmp/DeveloperIDG2CA.cer

          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Sign binary
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --options runtime \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --timestamp \
            sidestep-darwin-arm64

      - name: Verify signature
        run: codesign --verify --deep --strict sidestep-darwin-arm64

      - name: Notarize binary (via zip submission)
        env:
          APPLE_NOTARIZATION_APPLE_ID: ${{ secrets.APPLE_NOTARIZATION_APPLE_ID }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          APPLE_NOTARIZATION_TEAM_ID: ${{ secrets.APPLE_NOTARIZATION_TEAM_ID }}
        run: |
          ditto -c -k --keepParent sidestep-darwin-arm64 sidestep-darwin-arm64.zip
          xcrun notarytool submit sidestep-darwin-arm64.zip \
            --apple-id "$APPLE_NOTARIZATION_APPLE_ID" \
            --password "$APPLE_NOTARIZATION_PASSWORD" \
            --team-id "$APPLE_NOTARIZATION_TEAM_ID" \
            --wait --timeout 14400
          rm -f sidestep-darwin-arm64.zip

      - name: Upload signed artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-rc-binaries-darwin-arm64
          path: sidestep-darwin-arm64
          retention-days: 14

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build.keychain || true

  create-prerelease:
    name: Create Prerelease
    needs: [build, sign-and-notarize]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.sign-and-notarize.result == 'success' || needs.sign-and-notarize.result == 'skipped')
    permissions:
      contents: write
    environment: release
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          egress-policy: audit

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.sign-and-notarize.result == 'success' && 'signed-rc-binaries-darwin-arm64' || 'rc-binaries-darwin-arm64' }}
          path: dist/

      - name: List release files
        run: ls -la dist/

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.build.outputs.tag }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "$TAG" \
            --notes "$(cat <<NOTES
          Automated release candidate — cut from a merge to main.

          **Cargo version:** ${{ needs.build.outputs.version }}
          **Commit:** ${{ github.sha }}
          **Signed:** ${{ needs.sign-and-notarize.result == 'success' && 'Yes (Apple Developer ID, notarized)' || 'No (unsigned)' }}

          Install via Homebrew:
              brew install ArcavenAE/tap/sidestep-rc
          NOTES
          )" \
            dist/*


  update-homebrew:
    name: Update Homebrew Tap
    needs: [build, sign-and-notarize, create-prerelease]
    if: needs.create-prerelease.result == 'success' && needs.sign-and-notarize.result == 'success'
    permissions:
      contents: write
    environment: release
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Download signed binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-rc-binaries-darwin-arm64
          path: dist/

      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${{ needs.build.outputs.tag }}"
          SHA256_DARWIN_ARM64=$(shasum -a 256 dist/sidestep-darwin-arm64 | cut -d' ' -f1)

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/ArcavenAE/homebrew-tap.git" homebrew-tap-repo
          cd homebrew-tap-repo

          mkdir -p Formula
          cp ../Formula/sidestep-rc.rb Formula/sidestep-rc.rb

          VERSION="${{ needs.build.outputs.version }}"
          sed -i "s|VERSION_PLACEHOLDER|$VERSION|g" Formula/sidestep-rc.rb
          sed -i "s|TAG_PLACEHOLDER|$TAG|g" Formula/sidestep-rc.rb
          sed -i "s|SHA256_DARWIN_ARM64_PLACEHOLDER|$SHA256_DARWIN_ARM64|g" Formula/sidestep-rc.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/sidestep-rc.rb
          git diff --cached --quiet || git commit -m "Update sidestep-rc to $TAG"
          git push

  attest:
    name: Attest RC Provenance
    needs: [build, sign-and-notarize, create-prerelease]
    # Run after create-prerelease (the last asset mutation) so attestations
    # cover the bytes that ship — the signed + notarized binary uploaded to
    # the GitHub prerelease — not the pre-sign artifact.
    if: |
      !cancelled() &&
      needs.build.result == 'success' &&
      needs.create-prerelease.result == 'success' &&
      (needs.sign-and-notarize.result == 'success' || needs.sign-and-notarize.result == 'skipped')
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          egress-policy: audit

      - name: Download final release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          # Pull everything currently attached to the prerelease.
          gh release download "${{ needs.build.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir release-assets
          echo "Assets to be attested:"
          ls -la release-assets/

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: 'release-assets/*'
