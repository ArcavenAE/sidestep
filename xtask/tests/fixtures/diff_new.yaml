openapi: 3.0.3
info:
  title: synthetic spec for diff-spec tests
  version: "2"
paths:
  /a:
    get:
      operationId: listA
      parameters:
        - name: limit
          in: query
          required: true
          schema:
            type: integer
        - name: since
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Thing"
        "404":
          description: missing
  /b:
    get:
      operationId: listB
      responses:
        "200":
          description: ok
    post:
      operationId: createB
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                label:
                  type: string
      responses:
        "201":
          description: created
  /d/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getDetail
      responses:
        "200":
          description: ok
  /e:
    post:
      operationId: createE
      responses:
        "201":
          description: created
  /f:
    get:
      responses:
        "200":
          description: ok
components:
  schemas:
    Thing:
      type: object
      properties:
        id:
          type: string
        size:
          type: integer
    Fresh:
      type: string
